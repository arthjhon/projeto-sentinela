# Configuracao do detector (camada 1 + estatistica). Valores iniciais de bancada;
# recalibrar em campo. Duracoes em minutos/dias conforme o sufixo da chave.
sem_dados_max_min: 10     # fonte: spec 2026-11-17 §7.4.3 (firmware publica a cada 5 s)
estabilizacao_min: 30     # fonte: valor inicial de bancada; recalibrar em campo
janela_dias: 7            # fonte: spec 2026-11-17 §8 (janela bruta: regras da camada 1 e Hampel)
pico_min_count: 5         # fonte: decisao R23; picos isolados so tornam o sensor suspeito com >= 5 em 60 min (2-5 picos/semana em serie limpa); recalibrar em campo
janela_max_dias: 30       # fonte: decisao R25; teto do baseline flutuante (medias de 5 min desde o ultimo ponto de reinicio) usado por STL/CUSUM/Theil-Sen

sensores:
  ph:
    faixa: [0, 14]        # fonte: definicao da escala de pH
    plausivel: [5, 10]    # fonte: valor inicial de bancada; recalibrar em campo (agua doce/aquicultura)
    salto_max: 1.0        # fonte: valor inicial de bancada; recalibrar em campo
    travado_min_min: 120  # fonte: valor inicial de bancada; plateaus reais longos a noite; recalibrar em campo
    travado_eps: 0.005    # fonte: metade do LSB de 0.01 (firmware serializa 2 casas); travado = max-min na janela < eps, i.e. nenhuma variacao; recalibrar em campo
    piso: null
    mad_min: 0.01         # fonte: LSB de 0.01 do firmware; piso da escala do Hampel em janela plana; recalibrar em campo
    deriva:
      habilitado: true    # fonte: valor inicial; deriva lenta so e separavel de mudanca ambiental com referencia - recalibrar em campo
      delta_min: 0.3      # fonte: menor deslocamento de pH que interessa (unidades de pH); recalibrar em campo
      sigma_min: 0.05     # fonte: piso do ruido de nivel (variacao dia-a-dia plausivel); recalibrar em campo
      limiar_saida_frac: 0.5  # fonte: decisao R27 (histerese): ativa com |desvio 24 h| >= delta_min/2, sai abaixo de delta_min/4
  temperatura:
    faixa: [-10, 60]      # fonte: DS18B20 datasheet (-55 a 125 C), estreitado para agua
    plausivel: [15, 40]   # fonte: valor inicial de bancada; recalibrar em campo
    salto_max: 2.0        # fonte: valor inicial de bancada; recalibrar em campo
    travado_min_min: 360  # fonte: valor inicial de bancada; plateaus reais longos a noite; recalibrar em campo
    travado_eps: 0.005    # fonte: metade do LSB de 0.01 (firmware serializa 2 casas); travado = max-min na janela < eps, i.e. nenhuma variacao; recalibrar em campo
    piso: null
    mad_min: 0.0625       # fonte: 1 LSB do DS18B20 a 12 bits (0.0625 C); piso da escala do Hampel em janela plana
    deriva:
      habilitado: false   # fonte: valor inicial; deriva lenta so e separavel de mudanca ambiental com referencia - recalibrar em campo; temperatura sazonal/ambiental confunde com deriva
      delta_min: 1.0      # fonte: valor inicial; so vale se habilitado
      sigma_min: 0.2      # fonte: valor inicial; so vale se habilitado
      limiar_saida_frac: 0.5  # fonte: decisao R27; so vale se habilitado
  turbidez:
    # fonte: a confirmar na folha do TS-300B. Nao ha datasheet do fabricante acessivel;
    # anuncios de revendedores divergem (0-1000 NTU em OFweek/Robozar; 0-3000 NTU em
    # zbotic.in/turbidity-sensor-for-water-quality-arduino-interfacing-guide). Usa-se o maior.
    faixa: [0, 3000]
    plausivel: [0, 1000]  # fonte: valor inicial de bancada; recalibrar em campo
    salto_max: 200        # fonte: valor inicial de bancada; recalibrar em campo
    travado_min_min: 120  # fonte: valor inicial de bancada; plateaus reais longos a noite; recalibrar em campo
    travado_eps: 0.005    # fonte: metade do LSB de 0.01 (firmware serializa 2 casas); travado = max-min na janela < eps, i.e. nenhuma variacao; recalibrar em campo
    piso: 0               # fonte: firmware faz clamp de turbidez < 0 para 0
    mad_min: 1.0          # fonte: valor inicial de bancada (ruido ~1 NTU); piso da escala do Hampel em janela plana/clamp no 0; recalibrar em campo
    deriva:
      habilitado: false   # fonte: valor inicial; deriva lenta so e separavel de mudanca ambiental com referencia - recalibrar em campo; incrustacao e coberta pelo Theil-Sen
      delta_min: 5.0      # fonte: valor inicial; so vale se habilitado
      sigma_min: 2.0      # fonte: valor inicial; so vale se habilitado
      limiar_saida_frac: 0.5  # fonte: decisao R27; so vale se habilitado

stats:
  hampel_window: 121      # fonte: janela 21 marcava 29-99 amostras/semana limpa; 121 reduz a variancia do MAD; recalibrar em campo
  hampel_k: 5.0           # fonte: com janela 121, 2-5 marcacoes/semana limpa em serie sintetica; recalibrar em campo
  stl_period_s: 86400     # fonte: ciclo diario
  stl_min_days: 3         # fonte: valor inicial de bancada (fase de baseline do CUSUM); recalibrar em campo
  cusum_h: 8.0            # fonte: valor inicial; k = delta_min/2 por sensor (em sigma_eff); validado em sementes fora da calibracao; recalibrar em campo
  incrustacao_ntu_dia: 3.0  # fonte: valor inicial de bancada; recalibrar em campo
