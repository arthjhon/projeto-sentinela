server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — rotas do react-router não podem cair em 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com cache longo (Vite gera hashes nos nomes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Esta imagem NÃO faz proxy do InfluxDB. Um `location /influx/` genérico
    # encaminharia qualquer caminho (Flux, /query com q livre) com o token de
    # leitura. As consultas nomeadas /influx/q/* existem só no nginx do host
    # (infra/nginx/sentinela-influx-proxy.conf; runbook infra/README.md §14a/§14b).
}
