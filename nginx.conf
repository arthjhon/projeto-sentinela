server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — rotas do react-router não podem cair em 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com cache longo (Vite gera hashes nos nomes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy do InfluxDB (histórico do dashboard) ────────────────
    # Equivalente em produção ao server.proxy do vite.config.js.
    # O token é injetado AQUI, no servidor: se fosse uma var VITE_*, o Vite
    # o assaria no bundle, que é servido também ao site público.
    # É um token só-leitura escopado no bucket iot — nunca o admin.
    # ${INFLUXDB_*} são preenchidos pelo envsubst do nginx:alpine no boot
    # (por isso o Dockerfile copia este arquivo para /etc/nginx/templates).
    location /influx/ {
        proxy_pass ${INFLUXDB_URL}/;
        proxy_set_header Authorization "Token ${INFLUXDB_READ_TOKEN}";
        proxy_set_header Host $host;
    }
}
