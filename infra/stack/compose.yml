# Stack de producao do Sentinela (VM Debian). Servicos: influxdb + telegraf + worker.
# Valores vem do .env (nunca versionado).
services:
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?INFLUX_ADMIN_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: sentinela
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?INFLUX_ADMIN_TOKEN is required}
      # Flux query limits for the 768m container: at most 4 queries at once,
      # 10 queued, 64 MiB per query, 256 MiB for all queries together.
      INFLUXD_QUERY_CONCURRENCY: "4"
      INFLUXD_QUERY_QUEUE_SIZE: "10"
      INFLUXD_QUERY_MEMORY_BYTES: "67108864"
      INFLUXD_QUERY_MAX_MEMORY_BYTES: "268435456"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  telegraf:
    image: telegraf:1.33.3
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUX_TELEGRAF_TOKEN: ${INFLUX_TELEGRAF_TOKEN:?INFLUX_TELEGRAF_TOKEN is required}
      MQTT_BROKER: ${MQTT_BROKER:?MQTT_BROKER is required}
      MQTT_TELEGRAF_USER: ${MQTT_TELEGRAF_USER:?MQTT_TELEGRAF_USER is required}
      MQTT_TELEGRAF_PASS: ${MQTT_TELEGRAF_PASS:?MQTT_TELEGRAF_PASS is required}
    mem_limit: 128m

  # Coletores (Open-Meteo, ANA). Sem portas, sem volumes, raiz somente leitura.
  # A rede externa do Supabase serve so para o worker alcancar o Postgres.
  worker:
    image: ghcr.io/arthjhon/sentinela-worker:${WORKER_TAG:?WORKER_TAG is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: sentinela
      INFLUX_WORKER_TOKEN: ${INFLUX_WORKER_TOKEN:?INFLUX_WORKER_TOKEN is required}
      PG_WORKER_DSN: ${PG_WORKER_DSN:?PG_WORKER_DSN is required}
    networks:
      default: {}
      supabase: {}
    mem_limit: 384m

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?SUPABASE_NETWORK is required}

volumes:
  influxdb-data:
    name: sentinela-influxdb-data
  influxdb-config:
    name: sentinela-influxdb-config
