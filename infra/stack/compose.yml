# Stack de producao do Sentinela (VM Debian). Servicos: influxdb + telegraf + mosquitto + worker.
# Valores vem do .env (nunca versionado).
services:
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?INFLUX_ADMIN_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: sentinela
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?INFLUX_ADMIN_TOKEN is required}
      # Flux query limits for the 768m container: at most 4 queries at once,
      # 10 queued, 64 MiB per query, 256 MiB for all queries together.
      INFLUXD_QUERY_CONCURRENCY: "4"
      INFLUXD_QUERY_QUEUE_SIZE: "10"
      INFLUXD_QUERY_MEMORY_BYTES: "67108864"
      INFLUXD_QUERY_MAX_MEMORY_BYTES: "268435456"
    mem_limit: 768m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  telegraf:
    image: telegraf:1.33.3
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUX_TELEGRAF_TOKEN: ${INFLUX_TELEGRAF_TOKEN:?INFLUX_TELEGRAF_TOKEN is required}
      MQTT_BROKER: ${MQTT_BROKER:?MQTT_BROKER is required}
      MQTT_TELEGRAF_USER: ${MQTT_TELEGRAF_USER:?MQTT_TELEGRAF_USER is required}
      MQTT_TELEGRAF_PASS: ${MQTT_TELEGRAF_PASS:?MQTT_TELEGRAF_PASS is required}
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Broker MQTT proprio (substitui o HiveMQ Cloud). Dois listeners (ver mosquitto/mosquitto.conf):
  # 1883 TCP com autenticacao, so na rede do compose (nao publicado); 9001 WebSocket, publicado
  # so em 127.0.0.1 e exposto pelo tunel cloudflared (mqtt.arthlabs.dev). Nao entra na rede
  # externa `pg`: nao tem motivo para alcancar o Postgres.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    # A imagem declara VOLUME /mosquitto/log; o log vai para stdout, entao esse caminho
    # vira tmpfs em vez de um volume anonimo novo (orfao) a cada recriacao do container.
    tmpfs:
      - /mosquitto/log
    # O mosquitto nao sobe sem o password_file. Na primeira partida cria um arquivo vazio
    # (dono mosquitto, modo 600); se ja existir nao e tocado (as credenciais vivem no
    # volume). O dono mosquitto mantem o arquivo legivel depois que o broker larga os
    # privilegios (root -> usuario mosquitto); o HUP de recarga o le ja como mosquitto.
    command:
      - sh
      - -c
      - |
        if [ -e /mosquitto/data/passwd ]; then :; else
          (umask 077; : > /mosquitto/data/passwd)
          chown mosquitto:mosquitto /mosquitto/data/passwd
        fi
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    mem_limit: 64m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # Sem credencial: so confere que os dois listeners aceitam conexao TCP (busybox nc).
    # Nao prova auth/ACL (isso e o infra/tests/mosquitto.test.sh). Cada probe vira uma
    # linha de log "New connection"/"closed its connection"; 30 s mantem o ruido baixo.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 && nc -z 127.0.0.1 9001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Coletores (Open-Meteo, ANA) e detector. Sem portas, sem volumes, raiz somente leitura.
  # Rede externa: so a sentinela-pg (interna, criada a mao), onde so o supabase-db
  # entra. Nunca a supabase_default: la o postgres-meta (meta:8080) executa SQL como
  # supabase_admin sem autenticacao. Saida para a internet: rede default do projeto.
  worker:
    image: ghcr.io/arthjhon/sentinela-worker:${WORKER_TAG:?WORKER_TAG is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: sentinela
      INFLUX_WORKER_TOKEN: ${INFLUX_WORKER_TOKEN:?INFLUX_WORKER_TOKEN is required}
      PG_WORKER_DSN: ${PG_WORKER_DSN:?PG_WORKER_DSN is required}
      WORKER_VERSION: ${WORKER_TAG}
    networks:
      default: {}
      pg: {}
    mem_limit: 384m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pg:
    external: true
    name: ${SUPABASE_NETWORK:?SUPABASE_NETWORK is required}

volumes:
  influxdb-data:
    name: sentinela-influxdb-data
  influxdb-config:
    name: sentinela-influxdb-config
  mosquitto-data:
    name: sentinela-mosquitto-data
