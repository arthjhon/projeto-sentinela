# Sentinela broker. Contract used by compose (Task 3) and the live test
# infra/tests/mosquitto.test.sh. Users live in /mosquitto/data/passwd.
per_listener_settings true

persistence true
persistence_location /mosquitto/data/
log_dest stdout

max_packet_size 4096
max_keepalive 120
max_queued_messages 100

# Internal TCP: buoys, telegraf (svc/telegraf), edge function (svc/ota). Auth required.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_connections 200

# WebSockets (browsers, read-only for anonymous; buoys may also authenticate).
listener 9001
protocol websockets
allow_anonymous true
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_connections 200
