# Sentinela broker. Contract used by compose (Task 3) and the live test
# infra/tests/mosquitto.test.sh. Users live in /mosquitto/data/passwd.
per_listener_settings true

persistence true
persistence_location /mosquitto/data/
# Retained availability / ota/status are written to disk every 5 min (default
# 30 min): an OOM-kill under the compose mem_limit loses at most 5 min of them.
autosave_interval 300
log_dest stdout

max_packet_size 4096
max_keepalive 120
max_queued_messages 100

# Internal TCP (compose network only, no host port): telegraf (svc/telegraf). Auth required.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_connections 200

# WebSockets via the tunnel, path /mqtt: browsers (anonymous, read-only). Still
# accepts credentials (same passwd/ACL), but devices use 9002: a flood of
# anonymous connections here can fill only this listener's slots.
listener 9001
protocol websockets
allow_anonymous true
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_connections 150

# WebSockets via the tunnel, path /dev: authenticated clients only (boards
# snt-NNNN and the ota-command edge function, svc/ota). Its own slots, so the
# public listener cannot starve the devices.
listener 9002
protocol websockets
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_connections 20
