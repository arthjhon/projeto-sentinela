[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TELEGRAF_TOKEN}"
  organization = "sentinela"
  bucket = "iot"

# Todas as boias: <deviceId>/sensores e <deviceId>/status.
# O deviceId vira a tag device_id; a tag topic (padrao do plugin) e preservada
# porque o frontend filtra o historico por ela.
# MQTT_BROKER traz esquema e porta: tcp://mosquitto:1883 (broker da propria
# stack, so na rede interna do compose; usuario svc/telegraf). Se algum dia
# apontar para fora da stack, usar ssl:// com verificacao do certificado ativa
# (nunca insecure_skip_verify).
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_BROKER}"]
  topics = ["+/sensores", "+/status"]
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASS}"
  insecure_skip_verify = false
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/sensores"
    tags = "device_id/_"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/status"
    tags = "device_id/_"

  # Payload: {"turbidez","ph","temperatura"}; temperatura some se o sensor falha.
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensores"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "turbidez"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ph"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura"
      optional = true
      type = "float"

  # Payload: rssi, free_heap, total_heap, uptime, mqtt_latency (omitido se
  # indisponivel), calibrated (bool), firmware (string), min_free_heap, max_alloc_heap,
  # reset_reason (string, so na telemetria de 5 s, firmware >= 5.2.0); "board" e ignorado.
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "status"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "free_heap"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "total_heap"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mqtt_latency"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "calibrated"
      optional = true
      type = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "firmware"
      optional = true
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "min_free_heap"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "max_alloc_heap"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "reset_reason"
      optional = true
      type = "string"
