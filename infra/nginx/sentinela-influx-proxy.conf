# Read-only InfluxDB proxy for the Sentinela vhost: NAMED InfluxQL queries only.
#
# Why: the Flux endpoint (/api/v2/query) lets any visitor make InfluxDB fetch
# URLs (http/requests) and dial databases (sql.from) even with a read-only
# token (SSRF). Free-form InfluxQL is not safe either: it bypasses the Flux
# query controller, and a single small GET (`SELECT * FROM sensores,sensores,
# ...` repeated, many subqueries, several statements) OOM-kills InfluxDB.
# So there is NO `q` parameter here. Each endpoint below is a fixed, pre-encoded
# InfluxQL template; nginx fills it only with parameters validated by the maps
# in sentinela-http.conf (invalid or missing -> 400). See infra/README.md 14a.
#
# Endpoints (GET only; the response is the InfluxDB /query JSON, epoch=ms):
#   /influx/q/history?campo=ph|turbidez|temperatura&periodo=1h|24h|7d|30d[&device=ID]
#   /influx/q/ultimas?device=ID&periodo=24h|30d
#   /influx/q/leituras-24h
#   /influx/q/primeira
#   /influx/q/export?device=ID&periodo=1h|24h|7d|30d        (1 at a time, newest 600000 rows)
#   /influx/q/ana?estacao=39770000|39760000|39740000|39700000|39800100&inicio=YYYY-MM-DD&duracao=7d|30d|90d|180d
#                                                            (db=externos: ANA river data)
#   /influx/q/turbidez-janela?device=ID&inicio=YYYY-MM-DD&duracao=7d|30d|90d|180d   (db=iot)
#   /influx/q/status?device=ID&periodo=1h|24h|7d|30d         (db=iot: rssi, mqtt_latency, free_heap of <ID>/status)
# ID = [A-Za-z0-9_-]{1,40}; no quote or backslash can reach the template.
# inicio = Maceio local date, sent upstream as '<date>T03:00:00Z'; the window is
# [inicio, inicio + duracao) aggregated with GROUP BY time(15m|1h|3h|6h,3h) fill(none).
#
# Enable:  install -o root -g root -m 644 sentinela-influx-proxy.conf \
#            /etc/nginx/sentinela.d/influx-proxy.conf
#          plus /etc/nginx/sentinela-influx-token.conf (root 600):
#            set $influx_token "<token nginx-publico>";   (read iot + externos)
#          nginx -t && systemctl reload nginx
#          (needs infra/nginx/sentinela-http.conf: the maps and limit_*_zone)
# Disable: rm /etc/nginx/sentinela.d/influx-proxy.conf; nginx -t && systemctl reload nginx
#
# Included inside the sentinela server{} block. Every other /influx/ path
# (including /influx/query and /influx/api/v2/*) stays at 404 through the
# vhost's `location ^~ /influx/`; exact matches here win over it.
#
# Security model (do not "simplify" these away):
#  * The upstream URL is built here; the client's query string is never
#    forwarded (InfluxDB reads `u`/`p` from it before the Authorization header).
#  * The request body is never forwarded; a body over 1k is rejected (413).
#  * Write/DDL statements cannot be expressed. The token is read-only on iot and externos
#    as a second layer (a write-capable token here would still not matter).
#  * Cost: INFLUXD_INFLUXQL_MAX_SELECT_BUCKETS/SERIES, GOMEMLIMIT (compose.yml),
#    limit_req and limit_conn. Raw reads exist only in `ultimas` (LIMIT 50) and
#    `export` (one device, at most 30 days, newest 600000 rows via ORDER BY time DESC,
#    one at a time). Responses carry Cache-Control: no-store.
    location = /influx/q/history {
        if ($request_method != GET) { return 403; }
        if ($influx_campo = "") { return 400; }
        if ($influx_periodo = "") { return 400; }
        if ($influx_dev_opt = "bad") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20mean(%22$influx_campo%22)%20FROM%20%22sensores%22%20WHERE%20time%20%3E%20now()%20-%20$influx_periodo$influx_dev_opt%20GROUP%20BY%20time($influx_every)%20fill(none);
    }

    location = /influx/q/ultimas {
        if ($request_method != GET) { return 403; }
        if ($influx_dev_req = "") { return 400; }
        if ($influx_periodo_u = "") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20%22turbidez%22,%22ph%22,%22temperatura%22%20FROM%20%22sensores%22%20WHERE%20%22topic%22%20%3D%20$influx_dev_req%20AND%20time%20%3E%20now()%20-%20$influx_periodo_u%20ORDER%20BY%20time%20DESC%20LIMIT%2050;
    }

    location = /influx/q/leituras-24h {
        if ($request_method != GET) { return 403; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20count(%22ph%22)%20FROM%20%22sensores%22%20WHERE%20time%20%3E%20now()%20-%2024h;
    }

    location = /influx/q/primeira {
        if ($request_method != GET) { return 403; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20first(%22ph%22)%20FROM%20%22sensores%22;
    }

    location = /influx/q/export {
        if ($request_method != GET) { return 403; }
        if ($influx_dev_req = "") { return 400; }
        if ($influx_periodo = "") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        limit_conn influx_export 1;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20%22temperatura%22,%22ph%22,%22turbidez%22%20FROM%20%22sensores%22%20WHERE%20%22topic%22%20%3D%20$influx_dev_req%20AND%20time%20%3E%20now()%20-%20$influx_periodo%20ORDER%20BY%20time%20DESC%20LIMIT%20600000;
    }

    location = /influx/q/ana {
        if ($request_method != GET) { return 403; }
        if ($influx_estacao = "") { return 400; }
        if ($influx_inicio = "") { return 400; }
        if ($influx_duracao = "") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=externos&epoch=ms&q=SELECT%20sum(%22chuva%22)%20AS%20%22chuva%22,%20mean(%22vazao%22)%20AS%20%22vazao%22,%20mean(%22nivel%22)%20AS%20%22nivel%22%20FROM%20%22ana_telemetria%22%20WHERE%20%22estacao%22%20%3D%20%27$influx_estacao%27%20AND%20time%20%3E%3D%20$influx_inicio%20AND%20time%20%3C%20$influx_inicio%20%2B%20$influx_duracao%20GROUP%20BY%20time($influx_every_janela)%20fill(none);
    }

    location = /influx/q/turbidez-janela {
        if ($request_method != GET) { return 403; }
        if ($influx_dev_req = "") { return 400; }
        if ($influx_inicio = "") { return 400; }
        if ($influx_duracao = "") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20mean(%22turbidez%22)%20FROM%20%22sensores%22%20WHERE%20%22topic%22%20%3D%20$influx_dev_req%20AND%20time%20%3E%3D%20$influx_inicio%20AND%20time%20%3C%20$influx_inicio%20%2B%20$influx_duracao%20GROUP%20BY%20time($influx_every_janela)%20fill(none);
    }

    location = /influx/q/status {
        if ($request_method != GET) { return 403; }
        if ($influx_dev_status = "") { return 400; }
        if ($influx_periodo = "") { return 400; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        limit_conn influx_all 4;
        limit_conn influx_ip 3;
        limit_conn_status 429;
        client_max_body_size 1k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_set_header Content-Type "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_hide_header X-Platform-Error-Code;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/query?db=iot&epoch=ms&q=SELECT%20mean(%22rssi%22)%20AS%20%22rssi%22,%20mean(%22mqtt_latency%22)%20AS%20%22mqtt_latency%22,%20min(%22free_heap%22)%20AS%20%22free_heap%22%20FROM%20%22status%22%20WHERE%20%22topic%22%20%3D%20$influx_dev_status%20AND%20time%20%3E%20now()%20-%20$influx_periodo%20GROUP%20BY%20time($influx_every)%20fill(none);
    }

    location = /influx/health {
        if ($request_method != GET) { return 403; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_pass http://127.0.0.1:8086/health;
    }
