# OPTIONAL read-only InfluxDB proxy for the Sentinela vhost. NOT installed by
# default: Flux run through /api/v2/query can make InfluxDB fetch URLs
# (http/requests) and dial databases (sql.from) even with a read-only token
# (SSRF). Read "Proxy /influx/ - risco de SSRF" in infra/README.md first.
#
# Enable:  install -o root -g root -m 644 sentinela-influx-proxy.conf \
#            /etc/nginx/sentinela.d/influx-proxy.conf
#          plus /etc/nginx/sentinela-influx-token.conf (root 600):
#            set $influx_token "<token nginx-publico>";
#          nginx -t && systemctl reload nginx
# Disable: rm /etc/nginx/sentinela.d/influx-proxy.conf; nginx -t && systemctl reload nginx
#
# Included inside the sentinela server{} block. Only POST /influx/api/v2/query
# and GET /influx/health reach InfluxDB; the vhost's `location ^~ /influx/`
# keeps every other /influx/ path at 404 (exact matches win over it).
    location = /influx/api/v2/query {
        limit_except POST { deny all; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/api/v2/query$is_args$args;
    }

    location = /influx/health {
        limit_except GET { deny all; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization "";
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_pass http://127.0.0.1:8086/health;
    }
