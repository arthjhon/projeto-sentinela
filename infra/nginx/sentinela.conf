# Sentinela public site + read-only InfluxDB proxy.
# Installed at /etc/nginx/sites-available/sentinela.conf (enabled via symlink in
# sites-enabled). Needs infra/nginx/sentinela-http.conf in /etc/nginx/conf.d/
# (limit_req_zone "influx") and the root-600 token include
# /etc/nginx/sentinela-influx-token.conf containing: set $influx_token "<token>";
#
# Base: the production vhost as read on 2026-11-17 (spec 7.6). Diff it against
# /etc/nginx/sites-enabled/sentinela.conf before installing (infra/README.md).
server {
    listen 127.0.0.1:8088;
    server_name sentinela.arthlabs.dev origin-sentinela.arthlabs.dev sentinela-umj.arthlabs.dev;

    root /srv/sentinela/htdocs;

    access_log /var/log/nginx/sentinela.access.log;
    error_log /var/log/nginx/sentinela.error.log;

    server_tokens off;

    # All traffic arrives from cloudflared on loopback: take the client IP from
    # Cloudflare's header, so limit_req is per visitor and not global. Scoped to
    # this server (not http{}) so other vhosts keep the socket peer address.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Vite build assets (hashed file names): cache forever.
    location ^~ /assets/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Other static files: short cache. The extension list is a reconstruction
    # (spec 7.6 abbreviates it): reconcile with production in the diff step.
    location ~* \.(?:css|js|mjs|map|json|txt|xml|webmanifest|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---- InfluxDB, read-only (token nginx-publico: read bucket iot) ----------
    # Only POST /influx/api/v2/query and GET /influx/health reach InfluxDB;
    # every other /influx/ path is 404 (no buckets/auth/write/delete API).
    location = /influx/api/v2/query {
        limit_except POST { deny all; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/sentinela-influx-token.conf;   # set $influx_token "...";
        proxy_set_header Authorization "Token $influx_token";
        proxy_set_header Cookie "";
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8086/api/v2/query$is_args$args;
    }

    location = /influx/health {
        limit_except GET { deny all; }
        limit_req zone=influx burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization "";
        proxy_hide_header X-Influxdb-Build;
        proxy_hide_header X-Influxdb-Version;
        proxy_pass http://127.0.0.1:8086/health;
    }

    location ^~ /influx/ {
        return 404;
    }

    # SPA: never cache index.html, fall back to it for client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
