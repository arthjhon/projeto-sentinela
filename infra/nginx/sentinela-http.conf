# http{}-level pieces for the Sentinela vhost. Installed at
# /etc/nginx/conf.d/sentinela-http.conf. limit_req_zone can only live in http{}.
# Key = client IP after realip (set inside the sentinela server block from
# CF-Connecting-IP); 10 MB of state, 5 requests/s per IP (+ burst 10 there).
limit_req_zone $binary_remote_addr zone=influx:10m rate=5r/s;

# ---- /influx/q/<name>: NAMED queries (see sentinela-influx-proxy.conf) ------------
# Each client parameter is validated here and replaced by a constant or by a
# regex-checked value; anything else maps to "" (or "bad") and the location
# answers 400. Exact keys are matched case-insensitively but the VALUE is a
# constant, so the upstream query never carries client casing. Values are
# already percent-encoded for the upstream `q`.
map $arg_campo $influx_campo {
    default "";
    ph ph;
    turbidez turbidez;
    temperatura temperatura;
}
map $arg_periodo $influx_periodo {            # history, export
    default "";
    1h 1h;
    24h 24h;
    7d 7d;
    30d 30d;
}
map $arg_periodo $influx_every {              # history GROUP BY time(): same as PERIODS
    default "";
    1h 30s;
    24h 10m;
    7d 1h;
    30d 6h;
}
map $arg_periodo $influx_periodo_u {          # ultimas
    default "";
    24h 24h;
    30d 30d;
}
# Optional device (history): "" = no filter, "bad" = present but invalid.
map $arg_device $influx_dev_opt {
    default bad;
    "" "";
    "~^(?<d>[A-Za-z0-9_-]{1,40})$" "%20AND%20%22topic%22%20%3D%20%27${d}%2Fsensores%27";
}
# Required device (ultimas, export): the encoded literal 'device/sensores', "" = invalid.
map $arg_device $influx_dev_req {
    default "";
    "~^(?<d>[A-Za-z0-9_-]{1,40})$" "%27${d}%2Fsensores%27";
}

# ---- date windows (ana, turbidez-janela) -------------------------------------------
# `inicio` is the Maceio local date; the upstream literal is '<date>T03:00:00Z'
# (UTC-3, no DST). The regex is the same as INICIO_RE in src/services/influxQueries.js
# (year 20xx, month 01-12, day 01-31); only the captured date reaches the query.
map $arg_inicio $influx_inicio {
    default "";
    "~^(?<d>20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$" "%27${d}T03%3A00%3A00Z%27";
}
map $arg_duracao $influx_duracao {
    default "";
    7d 7d;
    30d 30d;
    90d 90d;
    180d 180d;
}
map $arg_duracao $influx_every_janela {       # GROUP BY time(): same as DURACOES
    default "";
    7d 15m;
    30d 1h;
    90d 3h;
    180d 6h,3h;
}
# ANA station: closed list (same as ESTACOES_ANA).
map $arg_estacao $influx_estacao {
    default "";
    39770000 39770000;
    39760000 39760000;
    39740000 39740000;
    39700000 39700000;
    39800100 39800100;
}

# InfluxQL does not go through the Flux query controller, so INFLUXD_QUERY_*
# does not bound it. limit_conn caps simultaneous queries (all endpoints, per
# client IP) and allows one export at a time.
limit_conn_zone $server_name zone=influx_all:64k;
limit_conn_zone $binary_remote_addr zone=influx_ip:10m;
limit_conn_zone $server_name zone=influx_export:64k;
