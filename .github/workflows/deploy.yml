name: Deploy to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MQTT_BROKER_URL: ${{ secrets.VITE_MQTT_BROKER_URL }}
          VITE_MQTT_USER: ${{ secrets.VITE_MQTT_USER }}
          VITE_MQTT_PASS: ${{ secrets.VITE_MQTT_PASS }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_INFLUX_ORG: ${{ secrets.VITE_INFLUX_ORG }}
          VITE_INFLUX_BUCKET: ${{ secrets.VITE_INFLUX_BUCKET }}
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_UMJ_RSYNC }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host umj-sentinela-deploy
            HostName 100.120.149.19
            User sentinela
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOF

      - name: Deploy via rsync
        run: |
          # A chave só tem permissão de rsync -wo (forced command rrsync no
          # servidor, destino /srv/sentinela/htdocs já fixado lá) — não é
          # possível rodar build/git/npm no servidor (disco compartilhado com
          # o Samba da UMJ, pouco espaço livre). --delete remove assets
          # antigos (hashes defasados) que o build não gera mais.
          rsync -av --delete dist/ umj-sentinela-deploy:
