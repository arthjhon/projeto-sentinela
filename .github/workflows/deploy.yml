name: Deploy to Production
on:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # TAILSCALE_AUTHKEY, SSH_KEY_UMJ_RSYNC e UMJ_KNOWN_HOSTS vivem no
    # environment `production` (só main, com aprovação). Ver infra/README.md.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MQTT_BROKER_URL: ${{ secrets.VITE_MQTT_BROKER_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_INFLUX_ORG: ${{ secrets.VITE_INFLUX_ORG }}
          VITE_INFLUX_BUCKET: ${{ secrets.VITE_INFLUX_BUCKET }}
          # opcional: sem o secret o mapa cai no fallback Esri (ver InteractiveMap.jsx)
          VITE_CARTO_BASEMAPS_KEY: ${{ secrets.VITE_CARTO_BASEMAPS_KEY }}
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH (pinned host key)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_UMJ_RSYNC }}
          KNOWN_HOSTS: ${{ secrets.UMJ_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          [ -n "$KNOWN_HOSTS" ] || { echo "UMJ_KNOWN_HOSTS is empty" >&2; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/config" <<EOF
          Host umj-sentinela-deploy
            HostName 100.120.149.19
            User sentinela
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF

      - name: Deploy via rsync
        run: |
          # A chave só tem permissão de rsync -wo (forced command rrsync no
          # servidor, destino /srv/sentinela/htdocs já fixado lá) — não é
          # possível rodar build/git/npm no servidor (disco compartilhado com
          # o Samba da UMJ, pouco espaço livre). --delete remove assets
          # antigos (hashes defasados) que o build não gera mais.
          rsync -av --delete dist/ umj-sentinela-deploy:

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
